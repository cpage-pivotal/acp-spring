name: Bug Report
description: Report a reproducible bug in Spring AI ACP
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues before opening a new one.
  - type: textarea
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual Behavior
      description: What actually happened? Include stack traces and the exact error text.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Minimal, concrete steps. A small code snippet or test is ideal.
      placeholder: |
        1. Add spring-ai-acp-boot-starter-goose
        2. Configure spring.acp.runtime=goose
        3. Call agentClient.prompt().user("...").call()
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: spring-ai-acp version (e.g., 0.3.0) and, if relevant, the agent version (goose, codex, opencode).
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Java version, Spring Boot version, OS, and whether this is the always-on suite or a live-agent run.
      placeholder: |
        Java 21, Spring Boot 4.1.x, macOS ...
  - type: textarea
    attributes:
      label: Additional Context
      description: Any other details that might help diagnose the issue.
