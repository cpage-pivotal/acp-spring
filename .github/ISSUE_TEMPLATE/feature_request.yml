name: Feature Request
description: Propose a new feature or behavior change for Spring AI ACP
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Significant or public-API changes are best discussed
        in an issue before an implementation is started.
  - type: textarea
    attributes:
      label: Problem
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution
      description: Describe the feature, API shape, or behavior change you have in mind.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: What workarounds or alternative designs have you considered?
  - type: checkboxes
    attributes:
      label: Scope
      options:
        - label: This feature belongs in the portable core (spring.acp.*), not a single agent's adapter
        - label: I can help implement this
