name: Question
description: Ask a question about Spring AI ACP behavior or usage
labels: [question]
body:
  - type: textarea
    attributes:
      label: Question
      description: What would you like to know? Include a minimal configuration or code snippet if relevant.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What you tried
      description: Anything you have already tried or read (README, user guide) so we do not repeat it.
